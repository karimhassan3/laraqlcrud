name: Publish Package to npm

on:
  push:
    tags:
      - 'v*.*.*' # Triggers only when you push a version tag like v1.0.0

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull down your repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js and point the registry to npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://npmjs.org' # Keep this as is!

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish --access public
        env:
          # This variable name MUST match what setup-node looks for
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} 
